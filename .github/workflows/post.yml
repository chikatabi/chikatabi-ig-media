name: Instagram に1本投稿する

on:
  schedule:
    # 22:30 UTC は日本時間の翌朝 7:30 にあたる。
    # GitHub Actions の cron は混雑時に5〜30分ほど遅れることがある。
    - cron: "30 22 * * *"
  workflow_dispatch:

# 前の実行が終わる前に次が始まると、同じ動画を二重に投稿しかねない。
concurrency:
  group: instagram-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: コミットする名前を設定する
        run: |
          git config user.name "chikatabi-bot"
          git config user.email "chika.vlog.chika@gmail.com"

      - name: キューの先頭を投稿する
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: python3 post.py
